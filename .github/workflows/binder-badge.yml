name: AddBinderBadge
on:
  pull_request_target:

permissions: {}

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: manics/action-binderbadge@99560b89939071823821e105afc83aaa87927e03 # v3.0.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
